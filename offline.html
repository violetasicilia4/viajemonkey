<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión | MonkeyTrip</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0c;
        color: #fafafa;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card { max-width: 360px; }
      h1 { font-size: 1.25rem; margin-bottom: 8px; }
      p { color: #a1a1aa; font-size: 0.95rem; line-height: 1.5; }
      button {
        margin-top: 20px;
        background: #ff385c;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sin conexión</h1>
      <p>No pudimos cargar MonkeyTrip todavía porque esta es la primera visita sin internet. Conectate una vez para que la app quede disponible offline.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
